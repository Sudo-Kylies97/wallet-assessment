name: wallet-assessment
services:
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ConnectionStrings__Wallet: Host=postgres;Database=wallet;Username=wallet;Password=wallet_dev_password;Timeout=5;Command Timeout=10;GSS Encryption Mode=Disable
      RabbitMq__ConnectionString: amqp://wallet:wallet_dev_password@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_dev_password
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1.4-management
    hostname: wallet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wallet
      RABBITMQ_DEFAULT_PASS: wallet_dev_password
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
  rabbitmq-data:
